name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Google Maps config
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p config
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            printf '%s\n' "window.GOOGLE_MAPS_API_KEY = '';" > config/google-maps.js
            echo "::warning::GOOGLE_MAPS_API_KEY secret is empty; maps will not load until the secret is set."
          else
            printf '%s\n' "window.GOOGLE_MAPS_API_KEY = '${GOOGLE_MAPS_API_KEY}';" > config/google-maps.js
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
